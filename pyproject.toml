[project]
name = "homework-drf"
version = "0.1.0"
description = ""
authors = [
    {name = "AntonDav23",email = "antonses@icloud.com"}
]
requires-python = ">=3.14"
dependencies = [
    "django (>=6.1.3,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "django-phonenumber-field[phonenumberslite] (>=9.0.0,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.5,<0.18.0)"
]


[tool.ruff]
line-length = 119
target-version = "py314"


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
